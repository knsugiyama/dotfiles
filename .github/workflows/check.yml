name: "Check Config"

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  check-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - name: Evaluate nix-darwin configuration
        run: nix build .#darwinConfigurations.macos.system --dry-run

  check-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - name: Evaluate Home Manager configuration (Linux)
        run: nix build .#homeConfigurations.wsl2.activationPackage --dry-run
