name: "Check Config"

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  check-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v25
        with:
          nix_path: nixpkgs=channel:nixos-unstable
      - name: Check nix-darwin configuration
        run: nix run nixpkgs#nix-darwin -- flake check --flake .#macos

  check-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v25
        with:
          nix_path: nixpkgs=channel:nixos-unstable
      - name: Check Home Manager configuration (Linux)
        run: nix run nixpkgs#home-manager -- flake check --flake .#wsl2
