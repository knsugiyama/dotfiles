# https://starship.rs/config/
"$schema" = "https://starship.rs/config-schema.json"

add_newline = true

# Avoid connected background blocks and Powerline separators. Their glyph
# metrics vary between terminal renderers and cause visible gaps on Terminal.app.
format = "$os$sudo$directory$git_branch$git_state$git_status$git_metrics$lua$nodejs$rust\n$character"
right_format = "$cmd_duration$time"

[os]
disabled = false
format = "[$symbol]($style) "
style = "bold blue"

[os.symbols]
Macos = "macOS"

[sudo]
disabled = false
symbol = "sudo"
format = "[$symbol]($style) "
style = "bold red"

[directory]
truncation_length = 6
truncation_symbol = "…/"
truncate_to_repo = false
home_symbol = "~"
read_only = " ro"
format = "[$path]($style)[$read_only]($read_only_style) "
style = "bold purple"
read_only_style = "bold red"

[git_branch]
symbol = "git:"
truncation_length = 16
truncation_symbol = "…"
format = "[$symbol$branch(:$remote_branch)]($style) "
style = "bold cyan"

[git_state]
format = '[\($state( $progress_current/$progress_total)\)]($style) '
style = "bold yellow"

[git_status]
disabled = false
format = "[$all_status$ahead_behind]($style)"
style = "bold red"
conflicted = "=${count} "
ahead = "↑${count} "
behind = "↓${count} "
diverged = "↕ "
up_to_date = ""
untracked = "?${count} "
stashed = '\$${count} '
modified = "!${count} "
renamed = "»${count} "
deleted = "-${count} "

[git_metrics]
disabled = false
format = "[Δ](bold cyan) [+$added]($added_style) [-$deleted]($deleted_style) "
added_style = "bold green"
deleted_style = "bold blue"

[lua]
symbol = "lua "
format = "[$symbol($version)]($style) "
style = "bold blue"

[nodejs]
symbol = "node "
format = "[$symbol($version)]($style) "
style = "bold green"
detect_extensions = ["js", "mjs", "cjs", "ts", "mts", "cts"]
detect_files = ["package.json", ".node-version", "!bunfig.toml", "!bun.lockb"]
detect_folders = ["node_modules"]

[rust]
symbol = "rust "
format = "[$symbol($version)]($style) "
style = "bold red"

[cmd_duration]
show_milliseconds = true
min_time = 100
format = "[took $duration]($style) "
style = "yellow"

[time]
disabled = false
format = "[$time]($style)"
time_format = "%T"
style = "dimmed white"

[character]
success_symbol = "[❯](bold cyan)"
error_symbol = "[❯](bold red)"
